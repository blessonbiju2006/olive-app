<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Olive APP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  
  <img src="images/icon.png" alt="A gold circular emblem with two leaves on a dark olive-green rounded square, presented against a white background. The raised metallic design has a calm, refined natural feel; no text is visible." style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;">
  <strong style="font-size: 16px;">Olive App</strong>
  <span class="sp"></span>
  <button class="btn sm" data-a="theme">◐ Dark Mode</button>
  <button class="btn sm" data-a="notify">🔔 Notify</button>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
